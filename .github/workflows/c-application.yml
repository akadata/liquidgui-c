name: C application

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libgtk-3-dev \
          xvfb

    - name: Build
      run: make

    - name: Build the privileged helper
      run: make helper/lg-helper

    - name: Unit, parity and migration tests
      run: make test

    # The discovery invariants are asserted by tests/test_detect_parity, which is
    # also part of `make test`. This runs the file on its own for a quick check
    # while discovery is being worked on.
    - name: Discovery parity assertions
      run: make check-parity

    # The interface is exercised headlessly so a crash on startup fails the build
    # rather than waiting to be discovered on a desktop.
    - name: Smoke test the interface
      run: |
        XDG_CONFIG_HOME="$RUNNER_TEMP/config" \
        xvfb-run -a ./liquidgui --no-apply --screenshot "$RUNNER_TEMP/shot.png"
        test -s "$RUNNER_TEMP/shot.png"

    - name: Upload the render
      uses: actions/upload-artifact@v4
      with:
        name: liquidgui-screenshot
        path: ${{ runner.temp }}/shot.png
        if-no-files-found: error

    # Sanitizers run last: `make sanitize` begins with `make clean`, so anything
    # that needs the built binary has to come before this step.
    - name: Sanitizers
      run: |
        make sanitize
        ./tests/test_json
        ./tests/test_curve_parity tests/golden/curve_golden.json
        ./tests/test_helper_allowlist
        ./tests/test_config
        ./tests/test_detect_parity tests/golden/detect_golden.json
